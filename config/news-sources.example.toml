# Public-export example source registry.
#
# This is a sanitized, placeholder copy.  Replace the example hosts
# with your own operators.  Do not publish real endpoints, tokens, or
# source identifiers.
#
# The runtime contacts these hosts only through host-side Unix-domain
# socket brokers; the brokers enforce a closed allowlist, HTTPS-only,
# DNS/IP/redirect/private-address checks, and a normalized-port policy.
#
# Adapter types and roles are public; query text and category scopes are
# illustrative and should be reviewed before publication.
version = 1

[[sources]]
source_id = "example-discovery-ai"
adapter_type = "searxng"
source_role = "discovery"
host = "search.example.com"
category_scope = ["ai"]
enabled = true
cadence_minutes = 180
[[sources.queries]]
text = "LLM+AI+model+release+2026"
categories = ["it", "news"]

[[sources]]
source_id = "example-feed-ai"
adapter_type = "rss"
source_role = "discovery"
host = "feed.example.com"
category_scope = ["ai"]
enabled = true
cadence_minutes = 60
[[sources.queries]]
text = "https://feed.example.com/news.xml"
