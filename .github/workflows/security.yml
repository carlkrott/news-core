# Local-only security gate for news-core.
#
# This workflow intentionally avoids every networked advisory feed and
# every secret-bearing context.  It enforces the same hard-deleted
# deltas the publication-safety scanner enforces on disk, then re-runs
# the container-contract verifier with no live host access, no broker
# sockets, and no credential-bearing inputs in scope.
name: security

"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly off-peak; refills nothing because the job is local-only.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-safety:
    name: publication-safety (recurring)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          check-latest: false
      - name: verify immutable action references
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          pattern = re.compile(r"^\s*uses:\s*[^@\s]+@([0-9a-f]{40})\s*$")
          bad = []
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.lstrip().startswith("uses:") and not pattern.match(line):
                      bad.append(f"{path}:{number}")
          if bad:
              print("mutable action references: " + ", ".join(bad), file=sys.stderr)
              raise SystemExit(1)
          print("all workflow action references are full commit SHAs")
          PY
      - name: re-scan publication surface
        run: python3 scripts/check_publication_safety.py .

  contract-verifier:
    name: verify_container_contract (security pass)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          check-latest: false
      - name: run verifier
        run: python3 scripts/verify_container_contract.py --candidate-root .
