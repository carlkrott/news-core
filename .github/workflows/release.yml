# Tag-gated release pipeline for news-core.
#
# This workflow is delivery-disabled by default.  It NEVER publishes an
# image to a registry and NEVER attaches binaries to a GitHub release
# without an explicit operator gate.
#
# Trigger model:
#   * A tag push matching vX.Y.Z runs `verify` and `build-artifacts`
#     automatically.  These jobs produce only host-local artifacts and
#     do not touch any registry, container image, or GitHub release.
#   * The `publish` job is a *gated* placeholder.  It is gated by:
#       1. the `release-approval` GitHub Environment, AND
#       2. the `run_publish` workflow input defaulting to `false`.
#     The `publish` job itself contains a single one-line step that
#     prints the gating intent and exits successfully; it does not
#     push an image, create a release, or upload binaries.  Wiring the
#     actual publish step is left to an operator-owned follow-up
#     tranche once the license and registry authority are decided.
#
# This file must not gain a `docker push` or a `gh release create`
# step until the operator has approved those actions.
name: release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_publish:
        description: "Actually run the gated publish job (requires release-approval environment)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify on tag
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - name: checkout (full history, tag context)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          check-latest: false

      - name: validate version tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unsupported version tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: derive version
        id: version
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: publication-safety scan
        run: |
          rm -rf /tmp/news-core-public-export
          python3 scripts/export_public_tree.py \
            --source . \
            --destination /tmp/news-core-public-export
          python3 scripts/check_publication_safety.py /tmp/news-core-public-export

      - name: compile-check
        run: python3 -m compileall -q scripts tests

      - name: focused unittest + contract checks
        run: |
          python3 -m unittest discover -s tests/news_pipeline \
            -p test_publication_safety.py -v
          python3 -m unittest discover -s tests/news_pipeline \
            -p test_container_contract.py -v

      - name: container-contract verifier
        run: python3 scripts/verify_container_contract.py --candidate-root .

  compose-render:
    name: render Compose topology on tag
    needs: verify
    runs-on: ubuntu-latest
    env:
      NEWS_BROKER_SOCKET_DIR: /tmp/news-brokers
      NEWS_CANARY_HOST_ROOT: /tmp/news-canary
      NEWS_CONTAINER_IMAGE: news-core:release
      NEWS_CONTAINER_SCHEDULER_AT: 2026-01-01T00:00:00Z
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: render Compose configuration
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.canary.yaml config \
            --format json > /tmp/compose-rendered.json
          test -s /tmp/compose-rendered.json

  image-smoke:
    name: build and inspect tagged image
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE: news-core:release-${{ github.sha }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: build local image
        run: |
          set -euo pipefail
          docker build --pull --tag "$IMAGE" \
            --build-arg OCI_SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg OCI_REVISION="$GITHUB_SHA" \
            --build-arg OCI_VERSION="${GITHUB_REF_NAME#v}" \
            --build-arg OCI_LICENSE="MIT" \
            --build-arg OCI_VENDOR="news-core" .
      - name: inspect image contract and import closure
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "ncnrun"
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' "$IMAGE")" = "null"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "news.container.delivery_disabled" }}' "$IMAGE")" = "true"
          docker run --rm --entrypoint /usr/local/bin/python3 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            -e PYTHONDONTWRITEBYTECODE=1 "$IMAGE" \
            -c 'import news_pipeline, news_container'

  build-artifacts:
    name: build local release artifacts
    needs: [verify, compose-render, image-smoke]
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          check-latest: false

      - name: render release manifest (host-local)
        run: |
          set -euo pipefail
          mkdir -p release-out
          python3 scripts/render_release_manifest.py \
            --candidate-root . \
            --output .release_manifest/candidate_manifest.json \
            > release-out/render.json
          cp .release_manifest/candidate_manifest.json release-out/manifest.json

      - name: create source archive from tagged tree
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="news-core-${version}/" \
            "$GITHUB_SHA" > "release-out/news-core-${version}.tar.gz"

      - name: upload local artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-source-and-manifest
          path: release-out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: gated publish (NOT active by default)
    needs: [verify, build-artifacts]
    # Triple gate so this job cannot run accidentally:
    #   (a) requires the explicit boolean input (off by default), AND
    #   (b) requires the `release-approval` environment to be created
    #       in repository settings before this branch can be merged, AND
    #   (c) is configured to skip on tag push (only manual dispatch is
    #       allowed to set run_publish=true).
    if: |
      github.event_name == 'workflow_dispatch'
        && inputs.run_publish == true
        && github.event.inputs.run_publish == 'true'
    environment:
      name: release-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: ubuntu-latest
    steps:
      - name: explicit no-publish notice
        # This job is a *placeholder*.  It does not push an image, does
        # not create a GitHub release, and does not upload binaries.
        # The `release-approval` environment gate plus the
        # `run_publish` boolean are the only ways to enter this job;
        # even after both gates pass, the body of the job is a
        # deliberate no-op so the operator must wire up publication
        # through a separate, operator-approved tranche.
        run: |
          echo "publish job entered but publication is intentionally disabled in this slice."
          echo "Wiring docker push / gh release create is an operator-owned follow-up."
          exit 0
